<app-demo-page
  badge="Core"
  title="Scroll Lock"
  description="A small Document-scoped foundation for locking body scroll across nested dialogs, drawers and floating workflows."
  [features]="[
    {
      title: 'Nested',
      description: 'Multiple consumers coordinate through a per-Document lock count',
    },
    { title: 'SSR', description: 'No DOM work when there is no browser window' },
    { title: 'Cleanup', description: 'destroy releases every outstanding lock for the consumer' },
    { title: 'CLI', description: 'pnpm quartz add scroll-lock' },
  ]"
>
  <section class="bg-[#0f1115] border border-white/10 rounded-xl p-6">
    <h2 class="text-lg font-semibold text-gray-200 mb-2">Document lock</h2>
    <app-code-block [code]="code">
      <div preview class="flex flex-col items-center gap-4">
        <div class="text-sm text-gray-400">
          State: <span class="text-gray-100">{{ locked() ? 'locked' : 'unlocked' }}</span>
        </div>
        <div class="flex gap-3">
          <button
            class="rounded-md bg-emerald-500 px-4 py-2 text-sm font-medium text-black"
            (click)="lock()"
          >
            Lock
          </button>
          <button
            class="rounded-md border border-white/15 px-4 py-2 text-sm text-gray-200"
            (click)="unlock()"
          >
            Unlock
          </button>
        </div>
      </div>
    </app-code-block>
  </section>
</app-demo-page>
