<header
  class="pointer-events-none fixed inset-x-0 top-4 z-50 mx-auto w-fit max-md:inset-x-3 max-md:top-3 max-md:mx-0 max-md:w-auto"
>
  <div
    class="pointer-events-auto flex items-center gap-6 rounded-full border border-line bg-surface-1/85 px-3 py-1.5 shadow-[0_10px_40px_rgb(0_0_0/0.5)] backdrop-blur-xl max-md:justify-between max-md:gap-2 md:pr-2 md:pl-5"
  >
    <button
      #toggle
      type="button"
      class="site-focus hidden size-11 items-center justify-center rounded-full text-fg-muted hover:bg-white/5 hover:text-fg max-md:flex"
      (click)="toggleMenu()"
      [attr.aria-expanded]="mobileNavOpen()"
      aria-controls="mobile-navigation"
      aria-label="Toggle navigation menu"
    >
      @if (mobileNavOpen()) {
        <lmn-x [size]="16" />
      } @else {
        <lmn-menu [size]="16" />
      }
    </button>

    <a
      routerLink="/"
      class="site-focus flex shrink-0 items-center gap-2.5 rounded-md no-underline"
      aria-label="Quartz Headless home"
    >
      <svg width="24" height="24" viewBox="0 0 32 32" aria-hidden="true" focusable="false">
        <defs>
          <linearGradient id="qz-gradient-header" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#10b981" />
            <stop offset="100%" stop-color="#6366f1" />
          </linearGradient>
        </defs>
        <path
          d="M16 2L28 14L16 30L4 14L16 2Z"
          stroke="url(#qz-gradient-header)"
          stroke-width="2.5"
          stroke-linejoin="round"
          fill="rgba(16, 185, 129, 0.05)"
        />
        <path
          d="M16 2V14M4 14H28M16 14L4 14M16 14L28 14M16 14L16 30"
          stroke="url(#qz-gradient-header)"
          stroke-width="1.5"
          stroke-linecap="round"
          stroke-dasharray="1 3"
        />
      </svg>
      <span class="text-[0.9375rem] font-bold tracking-tight whitespace-nowrap text-fg"
        >Quartz Headless</span
      >
    </a>

    <nav class="flex shrink items-center gap-1 max-md:hidden" aria-label="Primary">
      @for (link of links; track link.path) {
        <a
          [routerLink]="link.path"
          routerLinkActive="bg-accent/15 !text-fg shadow-[inset_0_0_0_1px_rgb(167_139_250/0.35)]"
          ariaCurrentWhenActive="page"
          [routerLinkActiveOptions]="{ exact: link.exact }"
          class="site-focus inline-flex min-h-10 items-center rounded-full px-4 text-sm font-medium whitespace-nowrap text-fg-muted transition-colors hover:bg-white/5 hover:text-fg"
          >{{ link.label }}</a
        >
      }
    </nav>

    <div class="flex shrink-0 items-center border-l border-line pl-2">
      <a
        [href]="github"
        target="_blank"
        rel="noopener"
        class="site-focus flex size-11 items-center justify-center rounded-full text-fg-muted transition-colors hover:bg-white/5 hover:text-fg md:size-10"
        aria-label="Quartz on GitHub (opens in a new tab)"
      >
        <lmn-github [size]="20" />
      </a>
    </div>
  </div>

  @if (mobileNavOpen()) {
    <!-- Mouse/touch dismiss layer only. Keyboard users close the menu with Escape, the toggle, or
      by tabbing away, so this stays out of the tab order and the accessibility tree. -->
    <!-- eslint-disable-next-line @angular-eslint/template/click-events-have-key-events, @angular-eslint/template/interactive-supports-focus -->
    <div
      class="pointer-events-auto fixed inset-0 z-40 bg-black/60 md:hidden"
      aria-hidden="true"
      data-testid="mobile-nav-backdrop"
      (click)="closeMenu()"
    ></div>

    <nav
      #panel
      id="mobile-navigation"
      aria-label="Mobile navigation"
      class="menu-in pointer-events-auto absolute top-[calc(100%+0.5rem)] right-0 left-0 z-50 origin-top rounded-2xl border border-line bg-surface-1 p-2 shadow-[0_10px_40px_rgb(0_0_0/0.5)] md:hidden"
    >
      @for (link of links; track link.path) {
        <a
          [routerLink]="link.path"
          routerLinkActive="bg-accent/15 !text-fg"
          ariaCurrentWhenActive="page"
          [routerLinkActiveOptions]="{ exact: link.exact }"
          (click)="closeMenu()"
          class="site-focus flex min-h-11 items-center rounded-xl px-4 text-sm font-medium text-fg-muted hover:bg-white/5 hover:text-fg"
          >{{ link.label }}</a
        >
      }
    </nav>
  }
</header>
