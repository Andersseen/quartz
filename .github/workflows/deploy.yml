name: CI / CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  quality:
    name: Quality Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type Check
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Format Check
        run: pnpm format:check

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Library
        run: pnpm build:lib

      - name: Verify Build Artifacts
        run: pnpm verify:build

      - name: Consumer Install Smoke Test
        run: pnpm verify:consumer

      - name: Run Unit Tests with Coverage
        run: pnpm test:coverage

      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-reports
          path: coverage/

  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Browsers
        run: pnpm exec playwright install --with-deps

      - name: Run E2E Tests
        run: pnpm e2e

      - name: Upload Playwright Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/

  deploy:
    name: Deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    needs: [unit-tests, e2e-tests]
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Demo
        run: pnpm run pages:build

      # Create the Pages project if it does not exist yet. This is idempotent:
      # if the project already exists the command fails safely and we continue.
      - name: Ensure Cloudflare Pages project exists
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages project create quartz-headless --production-branch=main
          packageManager: pnpm
        continue-on-error: true

      # Single source of truth: project name + output dir come from wrangler.toml,
      # the same config the local `pnpm pages:deploy` script uses.
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist/client --project-name quartz-headless --branch main --commit-dirty=true
          packageManager: pnpm

  # Publishes @quartz-headless/core and @quartz-headless/primitives (two independent
  # Angular library projects — see docs/ai/ARCHITECTURE.md). Core must publish first since
  # primitives declares it as a peer dependency. The old unscoped `quartz-headless` package
  # is frozen at its last published version and is no longer published from CI.
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    needs: [unit-tests, e2e-tests]
    if: github.ref == 'refs/heads/main'
    outputs:
      core-published: ${{ steps.version-core.outputs.published }}
      core-version: ${{ steps.version-core.outputs.version }}
      primitives-published: ${{ steps.version-primitives.outputs.published }}
      primitives-version: ${{ steps.version-primitives.outputs.version }}
      release-needed: ${{ steps.release-metadata.outputs.needed }}
      release-version: ${{ steps.release-metadata.outputs.version }}
      release-tag: ${{ steps.release-metadata.outputs.tag }}
      release-primary-tag: ${{ steps.release-metadata.outputs.primary-tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check @quartz-headless/core version availability
        id: version-core
        run: |
          version=$(node -p "require('./packages/core/package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if npm view "@quartz-headless/core@$version" version >/dev/null 2>&1; then
            echo "Version $version already exists on npm; skipping publication."
            echo "published=false" >> "$GITHUB_OUTPUT"
          else
            echo "Version $version is new; publication will proceed."
            echo "published=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build @quartz-headless/core
        if: steps.version-core.outputs.published == 'true'
        run: pnpm exec ng build quartz-core

      - name: Publish @quartz-headless/core
        if: steps.version-core.outputs.published == 'true'
        run: npm publish ./packages/core/dist --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Check @quartz-headless/primitives version availability
        id: version-primitives
        run: |
          version=$(node -p "require('./packages/primitives/package.json').version")
          if npm view "@quartz-headless/primitives@$version" version >/dev/null 2>&1; then
            echo "Version $version already exists on npm; skipping publication."
            echo "published=false" >> "$GITHUB_OUTPUT"
          else
            echo "Version $version is new; publication will proceed."
            echo "published=true" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build @quartz-headless/primitives
        if: steps.version-primitives.outputs.published == 'true'
        run: pnpm exec ng build quartz-core && pnpm exec ng build quartz-primitives

      - name: Publish @quartz-headless/primitives
        if: steps.version-primitives.outputs.published == 'true'
        run: npm publish ./packages/primitives/dist --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Resolve GitHub Release metadata
        id: release-metadata
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CORE_PUBLISHED: ${{ steps.version-core.outputs.published }}
          CORE_VERSION: ${{ steps.version-core.outputs.version }}
          PRIMITIVES_PUBLISHED: ${{ steps.version-primitives.outputs.published }}
          PRIMITIVES_VERSION: ${{ steps.version-primitives.outputs.version }}
        run: |
          if [ -n "$PRIMITIVES_VERSION" ]; then
            version="$PRIMITIVES_VERSION"
          else
            version="$CORE_VERSION"
          fi
          primary_tag="v$version"
          tag="$primary_tag"

          primary_body="$(gh release view "$primary_tag" --json body --jq .body 2>/dev/null || true)"
          if [ -n "$primary_body" ] && ! printf '%s' "$primary_body" | grep -q "@quartz-headless/.*@$version"; then
            tag="quartz-headless-v$version"
          fi

          needed=false
          if [ "$CORE_PUBLISHED" = "true" ] || [ "$PRIMITIVES_PUBLISHED" = "true" ]; then
            needed=true
          elif ! gh release view "$tag" >/dev/null 2>&1; then
            needed=true
          fi

          {
            echo "needed=$needed"
            echo "version=$version"
            echo "tag=$tag"
            echo "primary-tag=$primary_tag"
          } >> "$GITHUB_OUTPUT"

  # Fires if EITHER package actually published (core and primitives are meant to stay
  # version-locked, but this doesn't assume that holds — a core-only or primitives-only
  # bump still gets a release instead of publishing silently).
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [publish]
    if: |
      github.ref == 'refs/heads/main' &&
      needs.publish.outputs.release-needed == 'true'
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CORE_PUBLISHED: ${{ needs.publish.outputs.core-published }}
          CORE_VERSION: ${{ needs.publish.outputs.core-version }}
          PRIMITIVES_PUBLISHED: ${{ needs.publish.outputs.primitives-published }}
          PRIMITIVES_VERSION: ${{ needs.publish.outputs.primitives-version }}
          RELEASE_VERSION: ${{ needs.publish.outputs.release-version }}
          RELEASE_TAG: ${{ needs.publish.outputs.release-tag }}
          RELEASE_PRIMARY_TAG: ${{ needs.publish.outputs.release-primary-tag }}
        run: |
          version="$RELEASE_VERSION"
          tag="$RELEASE_TAG"
          primary_tag="$RELEASE_PRIMARY_TAG"

          notes="Packages in this release:"
          if [ -n "$CORE_VERSION" ]; then
            notes="$notes\n- @quartz-headless/core@$CORE_VERSION"
          fi
          if [ -n "$PRIMITIVES_VERSION" ]; then
            notes="$notes\n- @quartz-headless/primitives@$PRIMITIVES_VERSION"
          fi
          if [ "$tag" != "$primary_tag" ]; then
            notes="$notes\n\nNote: $primary_tag already exists from the legacy package release history, so this scoped release uses tag $tag."
          fi

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" \
              --target "$GITHUB_SHA" \
              --title "v$version" \
              --notes "$(printf '%b' "$notes")" \
              --latest
            exit 0
          fi

          gh release create "$tag" \
            --target "$GITHUB_SHA" \
            --title "v$version" \
            --notes "$(printf '%b' "$notes")" \
            --generate-notes \
            --latest
