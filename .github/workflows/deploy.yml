name: CI / CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      source_ref:
        description: Commit, tag, or branch to validate (and publish when explicitly enabled)
        required: true
        type: string
      publish:
        description: Publish this source after every required validation job passes
        required: false
        default: false
        type: boolean
      confirm_version:
        description: Exact lockstep package version to publish (required when publish is enabled)
        required: false
        type: string

jobs:
  quality:
    name: Quality Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.source_ref || github.sha }}

      - name: Setup Pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type Check
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Format Check
        run: pnpm format:check

      # Generated documentation must match the sources: doq-api reference pages and
      # doq content (source-backed pages), plus the Doqs integration diagnostics.
      - name: Documentation Generated Files Check
        run: |
          pnpm docs:api:check
          pnpm docs:content:check
          pnpm docs:doctor
          pnpm api:inventory:check

      # Every V/C/P parity row must still be backed by a real consumer test (see consumer/evidence-map.json).
      - name: Consumer Evidence Matrix
        run: pnpm verify:evidence

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.source_ref || github.sha }}

      - name: Setup Pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Library
        run: pnpm build:lib

      - name: Verify Build Artifacts
        run: pnpm verify:build

      - name: Consumer Install Smoke Test
        run: pnpm verify:consumer

      - name: Run Unit Tests with Coverage
        run: pnpm test:coverage

      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-reports
          path: coverage/

  # BUILD ONCE, PACK ONCE. This is the only job that compiles the publishable packages for release
  # purposes: it builds, runs the package/API guards, packs both tarballs and records hashes in
  # release-manifest.json. Every consumer job installs THESE tarballs (re-verified against the
  # manifest) and the publish job uploads THESE exact files. Nothing downstream rebuilds.
  package:
    name: Build and pack release artifacts
    runs-on: ubuntu-latest
    needs: quality
    outputs:
      manifest-sha256: ${{ steps.pack.outputs.manifest-sha256 }}
      version: ${{ steps.pack.outputs.version }}
      source-commit: ${{ steps.pack.outputs.source-commit }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.source_ref || github.sha }}

      - name: Setup Pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Library
        run: pnpm build:lib

      - name: Verify build, package metadata and public API guard
        run: pnpm verify:build

      - name: Pack tarballs and write release manifest
        id: pack
        run: |
          node scripts/release/release.mjs pack --out release-artifacts --commit "$(git rev-parse HEAD)"
          node scripts/release/release.mjs verify --dir release-artifacts --commit "$(git rev-parse HEAD)"
          {
            echo "manifest-sha256=$(sha256sum release-artifacts/release-manifest.json | cut -d' ' -f1)"
            echo "version=$(node scripts/release/release.mjs manifest-field --dir release-artifacts --name version)"
            echo "source-commit=$(git rev-parse HEAD)"
          } >> "$GITHUB_OUTPUT"
          cat release-artifacts/SHA256SUMS

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: release-artifacts/
          if-no-files-found: error
          retention-days: 30

  # Fast PR gate: the critical external paths on ONE toolchain (Angular 21.2, Chromium) — strict AOT of
  # the installed tarballs incl. the negative-template proof, real SSR, hydration, interaction, axe, the
  # CLI source-copy consumer and the bundle budgets. The full declared matrix runs in consumer-matrix.
  consumer-smoke:
    name: Consumer Smoke (Angular 21.2 / Chromium)
    runs-on: ubuntu-latest
    needs: [quality, package]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.source_ref || github.sha }}

      - name: Setup Pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-artifacts
          path: release-artifacts

      - name: Verify downloaded artifacts against the packed manifest
        env:
          EXPECTED_MANIFEST_SHA256: ${{ needs.package.outputs.manifest-sha256 }}
        run: |
          test "$(sha256sum release-artifacts/release-manifest.json | cut -d' ' -f1)" = "$EXPECTED_MANIFEST_SHA256"
          node scripts/release/release.mjs verify --dir release-artifacts --commit "$(git rev-parse HEAD)"
          echo "QUARTZ_RELEASE_ARTIFACTS=$PWD/release-artifacts" >> "$GITHUB_ENV"

      - name: Installed-tarball consumer (AOT, SSR, hydration, interaction, axe)
        run: pnpm verify:consumer:runtime -- --fixture angular-21.2 --project chromium

      - name: CLI source-copy consumer
        run: pnpm verify:consumer:cli -- --project chromium

      - name: Bundle size and tree-shaking budgets
        run: pnpm verify:bundle

  # Full declared support matrix. Each fixture has its OWN dependency tree + lockfile and runs on a
  # Node version its Angular release supports (https://angular.dev/reference/versions): Angular 21
  # accepts ^20.19 || ^22.12 || ^24, Angular 22 requires ^22.22.3 || ^24.15 || ^26. A failing cell
  # blocks publication; nothing here retries.
  consumer-matrix:
    name: Consumer ${{ matrix.fixture }} / Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    needs: [quality, package]
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { fixture: angular-21.2-min, node: '20.19.0' }
          - { fixture: angular-21.2, node: '24' }
          - { fixture: angular-22, node: '22' }
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.source_ref || github.sha }}

      - name: Setup Pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node (repository toolchain)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-artifacts
          path: release-artifacts

      - name: Verify downloaded artifacts against the packed manifest
        env:
          EXPECTED_MANIFEST_SHA256: ${{ needs.package.outputs.manifest-sha256 }}
        run: |
          test "$(sha256sum release-artifacts/release-manifest.json | cut -d' ' -f1)" = "$EXPECTED_MANIFEST_SHA256"
          node scripts/release/release.mjs verify --dir release-artifacts --commit "$(git rev-parse HEAD)"
          echo "QUARTZ_RELEASE_ARTIFACTS=$PWD/release-artifacts" >> "$GITHUB_ENV"

      - name: Setup Node (consumer toolchain)
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Report toolchain
        run: |
          echo "fixture=${{ matrix.fixture }}"
          node --version
          if [ "${{ matrix.fixture }}" = "angular-22" ]; then
            node -e "const [a,b,c]=process.versions.node.split('.').map(Number); if (a===22 ? (b<22||(b===22&&c<3)) : a<24) { console.error('Angular 22 requires Node ^22.22.3 || ^24.15 || ^26'); process.exit(1); }"
          fi

      - name: Installed-tarball consumer in Chromium, Firefox and WebKit
        run: pnpm verify:consumer:runtime -- --fixture ${{ matrix.fixture }}

      - name: Upload consumer evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: consumer-${{ matrix.fixture }}
          path: |
            consumer/results/
            test-results-consumer/

  # Angular 21.2 CLI consumer across all three engines (release only; the PR gate covers Chromium).
  cli-consumer:
    name: CLI source-copy consumer (3 engines)
    runs-on: ubuntu-latest
    needs: [quality, package]
    if: github.event_name != 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.source_ref || github.sha }}

      - name: Setup Pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-artifacts
          path: release-artifacts

      - name: Verify downloaded artifacts against the packed manifest
        env:
          EXPECTED_MANIFEST_SHA256: ${{ needs.package.outputs.manifest-sha256 }}
        run: |
          test "$(sha256sum release-artifacts/release-manifest.json | cut -d' ' -f1)" = "$EXPECTED_MANIFEST_SHA256"
          node scripts/release/release.mjs verify --dir release-artifacts --commit "$(git rev-parse HEAD)"
          echo "QUARTZ_RELEASE_ARTIFACTS=$PWD/release-artifacts" >> "$GITHUB_ENV"

      - name: CLI source-copy consumer
        run: pnpm verify:consumer:cli

  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: quality
    # A hung browser must fail the job (and keep its artifacts), not occupy a runner for hours.
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.source_ref || github.sha }}

      - name: Setup Pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Browsers
        run: pnpm exec playwright install --with-deps

      - name: Build and verify documentation output
        run: |
          pnpm build:demo
          pnpm docs:check

      # The CI profile (scripts/e2e/run.mjs): all three engines, pinned workers and retries from
      # playwright.config.ts, the exact output that just passed `docs:check` (E2E_BUILD=skip refuses
      # to serve anything incomplete). Reproduce locally with `pnpm e2e:ci`.
      - name: Run E2E Tests
        run: pnpm e2e:ci
        env:
          E2E_BUILD: skip

      - name: Upload Playwright Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/

      # First-failure evidence (traces, screenshots, per-test diagnostics.json, preview-server log,
      # machine-readable results). Only produced for failing tests, so green runs upload no traces.
      - name: Upload E2E failure diagnostics
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-failure-diagnostics
          path: |
            test-results/
            e2e-logs/
          if-no-files-found: ignore
          retention-days: 14

  deploy:
    name: Deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    needs: [unit-tests, e2e-tests, consumer-smoke]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.source_ref || github.sha }}

      - name: Setup Pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Demo (prerendered documentation + search index)
        run: pnpm run pages:build

      # Create the Pages project if it does not exist yet. This is idempotent:
      # if the project already exists the command fails safely and we continue.
      - name: Ensure Cloudflare Pages project exists
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages project create quartz-headless --production-branch=main
          packageManager: pnpm
        continue-on-error: true

      # Single source of truth: project name + output dir come from wrangler.toml,
      # the same config the local `pnpm pages:deploy` script uses.
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist/analog/public --project-name quartz-headless --branch main --commit-dirty=true
          packageManager: pnpm

  # Explicit manual release only. The publish job never builds: it downloads the tarballs the
  # `package` job produced and that the consumer matrix installed, re-verifies them against the
  # manifest (sha256, npm integrity, package contract, source commit, version confirmation), asks
  # the registry what already exists (fail closed), then publishes exactly those files — Core first.
  # Re-running is safe: versions that already match are verified and skipped; a version whose
  # integrity differs, an inconsistent Core/Primitives pair or any ambiguous registry answer stops
  # the job. The unscoped `quartz-headless` package remains frozen.
  publish:
    name: Publish validated artifacts to npm
    runs-on: ubuntu-latest
    needs:
      - package
      - unit-tests
      - e2e-tests
      - consumer-smoke
      - consumer-matrix
      - cli-consumer
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.publish == true
    # One publisher at a time per repository; a queued run waits instead of racing. Never cancel a
    # run that may be midway through publishing.
    concurrency:
      group: quartz-npm-release
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write # npm provenance attestation
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'

      - name: Source commit must be on main
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$(git rev-parse HEAD)" origin/main || {
            echo "Refusing publication: the selected source is not an ancestor of main."
            exit 1
          }

      - name: Download validated release artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-artifacts
          path: release-artifacts

      - name: Verify artifact identity (hash, integrity, contract, commit)
        env:
          EXPECTED_MANIFEST_SHA256: ${{ needs.package.outputs.manifest-sha256 }}
        run: |
          test "$(sha256sum release-artifacts/release-manifest.json | cut -d' ' -f1)" = "$EXPECTED_MANIFEST_SHA256"
          node scripts/release/release.mjs verify --dir release-artifacts --commit "$(git rev-parse HEAD)"

      - name: Registry reconciliation plan (read-only, fails closed)
        run: node scripts/release/release.mjs plan --dir release-artifacts

      - name: Publish (Core, then Primitives) with provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          CONFIRM_VERSION: ${{ inputs.confirm_version }}
        run: |
          node scripts/release/release.mjs publish \
            --dir release-artifacts \
            --commit "$(git rev-parse HEAD)" \
            --confirm-version "$CONFIRM_VERSION" \
            --provenance

  # Runs after a fully verified publication (also on a re-run, where publish verifies and skips).
  # The tag is created at the validated commit; an existing tag at another commit is a conflict.
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [package, publish]
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.publish == true
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download validated release artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-artifacts
          path: release-artifacts

      - name: Verify artifact identity
        env:
          EXPECTED_MANIFEST_SHA256: ${{ needs.package.outputs.manifest-sha256 }}
        run: |
          test "$(sha256sum release-artifacts/release-manifest.json | cut -d' ' -f1)" = "$EXPECTED_MANIFEST_SHA256"
          node scripts/release/release.mjs verify --dir release-artifacts --commit "$(git rev-parse HEAD)"

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/release/release.mjs github-release --dir release-artifacts --commit "$(git rev-parse HEAD)"
